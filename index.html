  </style>

  <script>
    const searchForm = document.getElementById('searchForm');
    const domainInput = document.getElementById('domainInput');
    const checkBtn = document.getElementById('checkBtn');
    const healthCard = document.getElementById('healthCard');
    const errorMessage = document.getElementById('errorMessage');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const domain = domainInput.value.trim();
      if (!domain) return;

      checkBtn.disabled = true;
      checkBtn.textContent = 'Checking...';
      hideError();

      try {
        await checkCertificate(domain);
      } catch (err) {
        showError('Check Failed', err.message);
        healthCard.classList.remove('visible');
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check';
      }
    });

    async function checkCertificate(domain) {
      const normalizedDomain = normalizeDomain(domain);

      const [certData, dnsData] = await Promise.all([
        fetchCertData(normalizedDomain),
        fetchDnsData(normalizedDomain)
      ]);

      displayResults(normalizedDomain, certData, dnsData);
    }

    function normalizeDomain(domain) {
      let d = domain.toLowerCase().trim();
      if (d.startsWith('http://')) d = d.slice(7);
      if (d.startsWith('https://')) d = d.slice(8);
      if (d.startsWith('www.')) d = d.slice(4);
      const slashIdx = d.indexOf('/');
      if (slashIdx > -1) d = d.slice(0, slashIdx);
      return d;
    }

    async function fetchCertData(domain) {
      const url = `https://crt.sh/?q=${encodeURIComponent(domain)}&output=json`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error('Failed to fetch certificate data from crt.sh');
      }

      const data = await response.json();

      if (!data || data.length === 0) {
        throw new Error('No certificates found for this domain');
      }

      const sorted = data.sort((a, b) => new Date(b.not_before) - new Date(a.not_before));
      return sorted[0];
    }

    async function fetchDnsData(domain) {
      try {
        const url = `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`;
        const response = await fetch(url);

        if (!response.ok) return null;

        const data = await response.json();
        return data.Status === 0 && data.Answer && data.Answer.length > 0;
      } catch {
        return null;
      }
    }

    function displayResults(domain, cert, dnsResolved) {
      document.getElementById('cardDomain').textContent = domain;

      const notBefore = new Date(cert.not_before);
      const notAfter = new Date(cert.not_after);
      const now = new Date();
      const daysUntilExpiry = Math.ceil((notAfter - now) / (1000 * 60 * 60 * 24));

      document.getElementById('validFrom').textContent = notBefore.toISOString().split('T')[0];
      document.getElementById('validUntil').textContent = notAfter.toISOString().split('T')[0];
      document.getElementById('daysRemaining').textContent = daysUntilExpiry;

      const issuerCN = extractIssuerCN(cert);
      document.getElementById('issuerName').textContent = issuerCN;

      const sans = parseSANs(cert);
      displaySANs(sans, domain);

      const issues = analyzeIssues(cert, sans, domain, daysUntilExpiry, issuerCN);
      displayIssues(issues);

      updateExpiryBadge(daysUntilExpiry);
      updateCoverage(sans, domain);
      updateDnsStatus(dnsResolved);
      updateTimestamp();

      healthCard.classList.add('visible');
    }

    function extractIssuerCN(cert) {
      try {
        const issuer = JSON.parse(cert.issuer);
        if (issuer.CN) return issuer.CN;
        if (issuer.O) return issuer.O;
        return 'Unknown';
      } catch {
        return cert.issuer_name || 'Unknown';
      }
    }

    function parseSANs(cert) {
      try {
        const parsed = JSON.parse(cert.subject);
        const sanField = parsed.SAN || parsed.alt_names || parsed.aia || '';
        if (typeof sanField === 'string') {
          return sanField.split(',').map(s => s.trim()).filter(Boolean);
        }
        if (Array.isArray(sanField)) {
          return sanField;
        }

        const rawSans = cert.san || '';
        if (typeof rawSans === 'string') {
          return rawSans.split(',').map(s => s.trim()).filter(Boolean);
        }
        return Array.isArray(rawSans) ? rawSans : [];
      } catch {
        const rawSans = cert.san || cert.sans || '';
        if (typeof rawSans === 'string') {
          return rawSans.split(',').map(s => s.trim()).filter(Boolean);
        }
        return Array.isArray(rawSans) ? rawSans : [];
      }
    }

    function displaySANs(sans, domain) {
      const sansList = document.getElementById('sansList');
      const sansCount = document.getElementById('sansCount');

      sansList.innerHTML = '';
      sansCount.textContent = sans.length;

      if (sans.length === 0) {
        sansList.innerHTML = '<span class="san-tag">No SANs found</span>';
        return;
      }

      sans.forEach(san => {
        const tag = document.createElement('span');
        tag.className = 'san-tag';
        tag.textContent = san;

        if (san.startsWith('*.')) {
          tag.classList.add('wildcard');
        }

        sansList.appendChild(tag);
      });
    }

    function updateExpiryBadge(days) {
      const badge = document.getElementById('expiryBadge');
      const text = document.getElementById('expiryText');

      badge.classList.remove('good', 'warning', 'danger');

      if (days <= 0) {
        badge.classList.add('danger');
        text.textContent = 'Expired';
      } else if (days <= 14) {
        badge.classList.add('danger');
        text.textContent = `${days} days left`;
      } else if (days <= 60) {
        badge.classList.add('warning');
        text.textContent = `${days} days`;
      } else {
        badge.classList.add('good');
        text.textContent = `${days} days`;
      }
    }

    function updateCoverage(sans, domain) {
      const wwwDomain = 'www.' + domain;
      const hasWww = sans.some(san => {
        const s = san.toLowerCase();
        return s === wwwDomain || s === domain;
      });

      const hasApex = sans.some(san => san.toLowerCase() === domain);

      const wwwIcon = document.getElementById('wwwIcon');
      const wwwText = document.getElementById('wwwText');
      const apexIcon = document.getElementById('apexIcon');
      const apexText = document.getElementById('apexText');

      if (hasWww) {
        wwwIcon.className = 'coverage-icon yes';
        wwwIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        wwwText.textContent = 'www. covered';
      } else {
        wwwIcon.className = 'coverage-icon no';
        wwwIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        wwwText.textContent = 'www. NOT covered';
      }

      if (hasApex) {
        apexIcon.className = 'coverage-icon yes';
        apexIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        apexText.textContent = 'Apex domain covered';
      } else {
        apexIcon.className = 'coverage-icon no';
        apexIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        apexText.textContent = 'Apex NOT covered';
      }
    }

    function updateDnsStatus(resolved) {
      const status = document.getElementById('dnsStatus');
      const text = document.getElementById('dnsText');

      status.classList.remove('resolved', 'unresolved');

      if (resolved === null) {
        status.classList.add('unresolved');
        text.textContent = 'DNS check unavailable';
      } else if (resolved) {
        status.classList.add('resolved');
        text.textContent = 'Domain resolves to A record';
      } else {
        status.classList.add('unresolved');
        text.textContent = 'Domain does not resolve';
      }
    }

    function analyzeIssues(cert, sans, domain, days, issuerCN) {
      const issues = [];

      if (days <= 0) {
        issues.push({
          type: 'error',
          text: `This certificate expired on ${new Date(cert.not_after).toISOString().split('T')[0]}. Visitors will see a security warning when accessing your site.`
        });
      } else if (days <= 14) {
        issues.push({
          type: 'warning',
          text: `This certificate will expire in ${days} days. Renew soon to avoid service interruption.`
        });
      }

      const selfSignedPatterns = ['self-signed', 'self signed', 'localhost', '.local'];
      if (selfSignedPatterns.some(p => issuerCN.toLowerCase().includes(p))) {
        issues.push({
          type: 'error',
          text: `The issuer "${issuerCN}" appears to be self-signed or internal. Public browsers will show security warnings for visitors.`
        });
      }

      const isWildcardOnly = sans.length > 0 && sans.every(san => san.startsWith('*.'));
      const hasExactMatch = sans.some(san => san.toLowerCase() === domain || san.toLowerCase() === '*.' + domain.slice(domain.indexOf('.') + 1));

      if (isWildcardOnly && !hasExactMatch) {
        issues.push({
          type: 'warning',
          text: `This certificate only covers wildcard patterns (e.g., *.example.com) but not the exact domain. Some services may fail validation.`
        });
      }

      const wwwDomain = 'www.' + domain;
      const hasWww = sans.some(san => san.toLowerCase() === wwwDomain || san.toLowerCase() === domain);

      if (!hasWww && domain.includes('.')) {
        issues.push({
          type: 'warning',
          text: `The "www." variant of your domain is not covered. Visitors accessing www.${domain} may see security warnings.`
        });
      }

      return issues;
    }

    function displayIssues(issues) {
      const container = document.getElementById('issuesList');
      container.innerHTML = '';

      if (issues.length === 0) {
        container.innerHTML = `
          <div class="no-issues">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            No issues detected. Your certificate appears healthy.
          </div>
        `;
        return;
      }

      issues.forEach(issue => {
        const item = document.createElement('div');
        item.className = `issue-item ${issue.type}`;
        item.innerHTML = `
          <div class="issue-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              ${issue.type === 'error'
                ? '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'
                : '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>'
              }
            </svg>
          </div>
          <div class="issue-text">${issue.text}</div>
        `;
        container.appendChild(item);
      });
    }

    function updateTimestamp() {
      const now = new Date();
      const formatted = now.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('timestamp').textContent = `Last checked: ${formatted}`;
    }

    function showError(title, text) {
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorText').textContent = text;
      errorMessage.classList.add('visible');
    }

    function hideError() {
      errorMessage.classList.remove('visible');
    }
  </script>
</body>
